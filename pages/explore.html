<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/public/images/icon/explicon.webp" />
    <title>Explore - AOSLab</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" href="/src/css/base/reset.css" />
    <link rel="stylesheet" href="/src/css/base/variables.css" />
    <link rel="stylesheet" href="/src/css/base/global.css" />
    <link rel="stylesheet" href="/src/css/effects/glass.css" />
    <link rel="stylesheet" href="/src/css/components/buttons.css" />
    <link rel="stylesheet" href="/src/css/components/navbar.css" />

    <link rel="stylesheet" href="/src/css/layout/explore.css" />
    <link rel="stylesheet" href="/src/css/base/mdVariables.css" />
    <link rel="stylesheet" href="/src/css/layout/exploreMd.css" />

    <!-- 响应式 -->
    <link rel="stylesheet" href="/src/css/responsive/mobileNav.css" />
    <link rel="stylesheet" href="/src/css/responsive/expl.css" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- LaTeX 支持 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
    ></script>
  </head>
  <body>
    <div id="night-sky-bg"></div>

    <nav
      class="home-nav"
      data-responsive-menu="explore"
      data-menu-open-class="explore-menu-open"
      data-menu-event="explore:render-pause"
    >
      <div class="nav-left">
        <button
          class="explore-left-toggle btn-circle glass"
          aria-label="Open planet list"
          aria-expanded="false"
        >
          <i class="fa-solid fa-earth-americas"></i>
        </button>
      </div>
      <div class="nav-right">
        <button
          class="explore-menu-close"
          data-responsive-menu-close="explore"
          aria-label="Close menu"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
        <div
          class="explore-sidebar-avatar"
          style="
            background-image: url(&quot;/public/images/touxiang/touxiang.webp&quot;);
          "
        ></div>
        <div class="nav-bar glass">
          <div
            class="btn-circle"
            data-tooltip="Home"
            onclick="window.location.href = '/homepage.html'"
          >
            <img src="/public/images/icon/hpg.webp" alt="Home" />
          </div>
          <div
            class="btn-circle"
            data-tooltip="Library"
            onclick="window.location.href = '/pages/library.html'"
          >
            <img src="/public/images/icon/tsg.webp" alt="Library" />
          </div>
          <div class="btn-circle" id="launch-btn" data-tooltip="To Space">
            <img src="/public/images/icon/landing.webp" alt="Launch" />
          </div>
        </div>
      </div>
      <div class="controls">
        <div class="btn-circle glass" id="theme-toggle"></div>
        <div
          class="avatar-btn"
          style="
            background-image: url(&quot;/public/images/touxiang/touxiang.webp&quot;);
          "
          onclick="window.location.href = '/pages/me.html'"
        ></div>
      </div>
      <div class="explore-top-actions">
        <button
          class="explore-menu-toggle btn-circle glass"
          data-responsive-menu-toggle="explore"
          aria-label="Open navigation"
          aria-expanded="false"
        >
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
    </nav>
    <div
      class="explore-menu-backdrop"
      data-responsive-menu-backdrop="explore"
    ></div>

    <main class="explore-layout">
      <aside class="col-left">
        <button class="explore-left-close" aria-label="Close planet list">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="switcher-container">
          <div class="system-switcher glass" id="system-switcher">
            <div class="sys-info">
              <img src="/planets/icon/atom.webp" alt="Logo" class="sys-logo" />
              <div class="sys-text">
                <h3 id="current-sys-name" class="accent-text">Loading...</h3>
                <p id="current-sys-dist" class="gray-text">距离地球 -- 光年</p>
              </div>
            </div>

            <i class="fa-solid fa-chevron-down dropdown-icon"></i>
          </div>

          <div class="sys-dropdown glass" id="sys-dropdown">
            <div class="sys-dropdown-item">
              <img src="/planets/icon/atom.webp" alt="Logo" class="sys-logo" />
              <span class="sys-item-name accent-text">系统名称</span>
            </div>
          </div>
        </div>

        <div class="planet-list-card glass fade-mask">
          <div class="planet-list-container" id="planet-list">
            <div class="active-indicator" id="active-indicator"></div>
          </div>
        </div>
      </aside>

      <section class="col-middle">
        <div id="planet-system-stage">
          <div id="planet-canvas-container"></div>
          <div class="planet-shadow" id="planet-shadow"></div>
          <div id="moon-labels-container"></div>
        </div>

        <div class="col-middle-ui-overlay">
          <header class="planet-header">
            <h2 id="mid-planet-name" class="accent-text">--</h2>
            <p id="mid-planet-desc" class="planet-brief gray-text">--</p>
          </header>

          <div class="planet-controls">
            <button class="control-btn glass" id="btn-prev">
              <i class="fa-solid fa-arrow-left"></i>
            </button>
            <button class="control-btn explore-btn glass" id="btn-explore">
              EXPLORE
            </button>
            <button class="control-btn glass" id="btn-next">
              <i class="fa-solid fa-arrow-right"></i>
            </button>
            <button
              class="control-btn glass"
              id="btn-stop"
              title="冻结/恢复时空"
            >
              <i class="fa-solid fa-pause" id="stop-icon"></i>
            </button>
          </div>
        </div>

        <div class="moon-info-card glass" id="moon-info-card">
          <h4 id="moon-card-name" class="moon-card-name accent-text">--</h4>
          <p id="moon-card-desc">--</p>
          <button id="close-moon-card" class="btn-close">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div class="explore-modal" id="explore-modal">
          <button class="close-modal-btn" id="close-explore-modal">
            <i class="fa-solid fa-xmark"></i>
          </button>
          <div class="markdown-body" id="md-content"></div>
        </div>
      </section>

      <aside class="col-right">
        <div class="nav-spacer"></div>

        <div class="data-card glass">
          <h4 class="gray-text card-title">PLANET OVERVIEW</h4>
          <div class="divider"></div>
          <div class="data-list" id="overview-list"></div>
        </div>

        <div
          class="data-card glass"
          style="
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 430px);
          "
        >
          <h4 class="gray-text card-title">HIGHLIGHT</h4>
          <div class="divider"></div>
          <div
            class="highlight-list"
            id="highlight-list"
            style="overflow-y: auto; flex-grow: 1; padding-right: 5px"
          ></div>
        </div>
      </aside>
    </main>
    <div class="explore-left-backdrop"></div>

    <!--拖拽支持-->
    <script src="/src/js/global/drager.js"></script>
    <script defer src="/src/js/responsiveJS/mobileNav.js"></script>
    <script defer src="/src/js/explore/mobileExploreLayout.js"></script>
    <script type="module" src="../src/js/global/theme.js"></script>
    <script type="module" src="../src/js/global/launch.js"></script>
    <script type="module" src="../src/js/explore/explorePlanet02.js"></script>
    <script type="module" src="../src/js/explore/exploreUI.js"></script>
    <script type="module" src="../src/js/explore/exploreMd.js"></script>
  </body>
</html>
